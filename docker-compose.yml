services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cyberval
      POSTGRES_USER: cyberval
      POSTGRES_PASSWORD: cyberval
    ports:
      - "5433:5432"
    volumes:
      - cyberval-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberval -d cyberval"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://cyberval:cyberval@db:5432/cyberval
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python init_db.py && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  cyberval-postgres:
